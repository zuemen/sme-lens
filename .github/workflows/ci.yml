name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      # 離線快照必須與後端同步。四份快照都由 make_snapshots.py 對同一份程式碼
      # 產生，重產後有 diff 就代表 commit 的是舊的——實際發生過：後端加了
      # tier／bridge_only 兩個欄位，group-snapshot 沒跟著重產。現場斷網時
      # 演示用的就是這份快照。
      - name: Snapshots are in sync with the backend
        run: |
          PYTHONIOENCODING=utf-8 PYTHONPATH=. python scripts/make_snapshots.py
          git diff --exit-code web/src/api/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # 端對端：企劃書與 README 宣稱「端對端測試全綠、CI 持續驗證」——那句話要
  # 成立，Playwright 就必須真的在 CI 裡跑。e2e 需要活的後端：前端只在
  # status 0 或 5xx 時退回離線快照（4xx 是設定錯誤，刻意不遮蓋），沒有後端
  # 時三個 demo 頁會停在錯誤訊息上。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 後端由 playwright.config.ts 的 webServer 自行啟動並等 /ready，這裡只
      # 負責把相依裝好。
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install uvicorn
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        working-directory: web
        env:
          # build-time 變數：playwright.config.ts 的 webServer 會自行 build，
          # 這個值必須在那個 build 進行時就存在。
          VITE_API_BASE: http://127.0.0.1:8000
        run: npm run e2e
